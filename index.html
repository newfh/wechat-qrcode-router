<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <div class="qrcode-box">
            <img id="qrcode-img" src="" alt="微信扫码" class="qrcode-display">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在加载二维码...</p>
            </div>
            <div class="tip">
                <p>请使用微信扫描二维码</p>
            </div>
            <div class="backup-link" id="backup-link" style="display:none;">
                <a href="#" id="backup-url" target="_blank">如无法扫码，点击手动添加</a>
            </div>
        </div>
        <div class="info-box">
            <p class="visit-count">已扫描 <span id="count">0</span> 次</p>
            <p class="update-time" id="update-time"></p>
        </div>
    </div>

    <script>
        (function() {
            const GITHUB_TOKEN = 'ghp_PLACEHOLDER_TOKEN';
            const REPO_OWNER = 'newfh';
            const REPO_NAME = 'wechat-qrcode-router';
            const CONFIG_FILE = 'config.json';
            
            let config = null;
            let currentQRIndex = 0;

            // 从 GitHub API 获取配置
            async function fetchConfig() {
                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONFIG_FILE}?token=${GITHUB_TOKEN}`
                    );
                    const data = await response.json();
                    
                    if (data.content) {
                        config = JSON.parse(atob(data.content));
                        return true;
                    }
                } catch (error) {
                    console.error('获取配置失败:', error);
                }
                return false;
            }

            // 更新 GitHub 上的配置
            async function updateConfig() {
                if (!config) return;
                
                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONFIG_FILE}`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                message: `更新活码配置 - ${new Date().toLocaleString()}`,
                                content: btoa(JSON.stringify(config)),
                                sha: config.sha || ''
                            })
                        }
                    );
                    return response.ok;
                } catch (error) {
                    console.error('更新配置失败:', error);
                    return false;
                }
            }

            // 获取当前有效的二维码
            function getActiveQRCode() {
                const qrcodes = config.wechat_qrcodes.filter(qr => qr.status === 1);
                if (qrcodes.length === 0) return null;

                if (config.settings.switch_mode === 'round') {
                    // 轮询模式
                    currentQRIndex = currentQRIndex % qrcodes.length;
                    return qrcodes[currentQRIndex];
                } else if (config.settings.switch_mode === 'random') {
                    // 随机模式
                    return qrcodes[Math.floor(Math.random() * qrcodes.length)];
                }
                
                return qrcodes[0];
            }

            // 处理访问
            async function handleVisit() {
                if (!config) return;

                const activeQR = getActiveQRCode();
                if (!activeQR) {
                    showError('所有二维码已失效');
                    return;
                }

                // 更新访问计数
                activeQR.visit_count++;
                activeQR.daily_count++;
                config.settings.total_visits++;
                config.settings.current_index = config.wechat_qrcodes.indexOf(activeQR);
                config.settings.updated_at = new Date().toLocaleString('zh-CN');

                // 显示二维码
                displayQR(activeQR);

                // 异步更新 GitHub
                updateConfig();
            }

            // 显示二维码
            function displayQR(qr) {
                const img = document.getElementById('qrcode-img');
                const loading = document.getElementById('loading');
                const backupLink = document.getElementById('backup-link');
                const backupUrl = document.getElementById('backup-url');
                const countEl = document.getElementById('count');
                const updateTimeEl = document.getElementById('update-time');

                // 隐藏加载动画
                loading.style.display = 'none';
                
                // 显示二维码图片
                img.src = qr.qrcode_url;
                img.style.display = 'block';
                
                // 显示备用链接（如果有的话）
                if (qr.wechat_id) {
                    backupUrl.href = `https://weixin.qq.com/r/${qr.wechat_id}`;
                    backupLink.style.display = 'block';
                }

                // 更新计数
                countEl.textContent = qr.visit_count;
                updateTimeEl.textContent = `最后更新: ${config.settings.updated_at}`;
            }

            // 显示错误
            function showError(msg) {
                const loading = document.getElementById('loading');
                loading.innerHTML = `<p class="error">${msg}</p>`;
                loading.style.display = 'block';
            }

            // 初始化
            async function init() {
                const loaded = await fetchConfig();
                if (!loaded) {
                    showError('加载配置失败，请稍后重试');
                    return;
                }

                await handleVisit();
            }

            init();
        })();
    </script>
</body>
</html>
