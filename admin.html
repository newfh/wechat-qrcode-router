<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活码管理后台</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .qr-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .qr-item {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }

        .qr-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .qr-item.active {
            border-color: #4caf50;
            background: #f1f8e9;
        }

        .qr-item.inactive {
            border-color: #f44336;
            background: #ffebee;
            opacity: 0.7;
        }

        .qr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .qr-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .qr-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .qr-status.active {
            background: #4caf50;
            color: white;
        }

        .qr-status.inactive {
            background: #f44336;
            color: white;
        }

        .qr-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .qr-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qr-info-item label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .qr-info-item span {
            font-size: 14px;
            color: #333;
        }

        .qr-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #43a047;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #e53935;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .add-qr-form {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }

        .add-qr-form.show {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .settings-section {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .settings-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>📱 微信扫码活码管理后台</h1>
            <button class="btn btn-primary" onclick="toggleAddForm()">+ 添加二维码</button>
        </div>
        
        <div class="content">
            <!-- 统计信息 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>总访问次数</h3>
                    <div class="value" id="total-visits">0</div>
                </div>
                <div class="stat-card">
                    <h3>当前活跃码数</h3>
                    <div class="value" id="active-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>二维码总数</h3>
                    <div class="value" id="total-count">0</div>
                </div>
            </div>

            <!-- 设置 -->
            <div class="settings-section">
                <h3>⚙️ 切换模式设置</h3>
                <div class="form-group">
                    <label>切换模式</label>
                    <select id="switch-mode" onchange="updateSettings()">
                        <option value="round">轮询模式</option>
                        <option value="random">随机模式</option>
                    </select>
                </div>
            </div>

            <!-- 二维码列表 -->
            <div class="qr-list" id="qr-list"></div>

            <!-- 添加二维码表单 -->
            <div class="add-qr-form" id="add-form">
                <h3 style="margin-bottom: 20px;">添加新二维码</h3>
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="new-name" placeholder="例如：微信号-客服4">
                </div>
                <div class="form-group">
                    <label>二维码图片</label>
                    <input type="file" id="new-file" accept="image/*" onchange="previewImage(event)">
                    <div id="image-preview" style="margin-top: 10px; display: none;">
                        <img id="preview-img" style="max-width: 200px; border-radius: 8px;">
                        <p style="font-size: 12px; color: #666; margin-top: 5px;">图片已选择，点击添加将上传到GitHub</p>
                    </div>
                </div>
                <div class="form-group">
                    <label>微信号ID</label>
                    <input type="text" id="new-wechat" placeholder="例如：kefu004">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-success" onclick="addQRCode()">添加</button>
                    <button class="btn btn-secondary" onclick="toggleAddForm()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = 'ghp_PLACEHOLDER_TOKEN';
        const REPO_OWNER = 'newfh';
        const REPO_NAME = 'wechat-qrcode-router';
        const CONFIG_FILE = 'config.json';
        
        let config = null;
        let selectedImageFile = null;

        // 预览图片
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedImageFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('image-preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // 上传图片到GitHub
        async function uploadImageToGitHub(filename, file) {
            const base64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.readAsDataURL(file);
            });

            const headers = {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
            };

            // 检查文件是否已存在
            let currentSha = '';
            try {
                const checkResp = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${filename}`,
                    { headers }
                );
                if (checkResp.ok) {
                    const checkData = await checkResp.json();
                    currentSha = checkData.sha;
                }
            } catch (e) {
                // 文件不存在，继续
            }

            // 上传文件
            const uploadData = {
                message: `上传二维码图片: ${filename}`,
                content: base64,
                sha: currentSha
            };

            const response = await fetch(
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${filename}`,
                {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(uploadData)
                }
            );

            if (!response.ok) {
                throw new Error('图片上传失败');
            }

            return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/gh-pages/images/${filename}`;
        }

        // 获取配置
        async function fetchConfig() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONFIG_FILE}?token=${GITHUB_TOKEN}`
                );
                const data = await response.json();
                
                if (data.content) {
                    config = JSON.parse(atob(data.content));
                    config.sha = data.sha;
                    return true;
                }
            } catch (error) {
                console.error('获取配置失败:', error);
            }
            return false;
        }

        // 更新配置到 GitHub
        async function updateConfig() {
            if (!config) return;
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONFIG_FILE}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `更新活码配置 - ${new Date().toLocaleString()}`,
                            content: btoa(JSON.stringify(config)),
                            sha: config.sha
                        })
                    }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    config.sha = data.content.sha;
                    alert('更新成功！');
                    return true;
                } else {
                    alert('更新失败，请稍后重试');
                    return false;
                }
            } catch (error) {
                console.error('更新配置失败:', error);
                alert('更新失败：' + error.message);
                return false;
            }
        }

        // 渲染二维码列表
        function renderQRList() {
            const listEl = document.getElementById('qr-list');
            listEl.innerHTML = '';

            config.wechat_qrcodes.forEach((qr, index) => {
                const item = document.createElement('div');
                item.className = `qr-item ${qr.status === 1 ? 'active' : 'inactive'}`;
                item.innerHTML = `
                    <div class="qr-header">
                        <span class="qr-name">${qr.name}</span>
                        <span class="qr-status ${qr.status === 1 ? 'active' : 'inactive'}">
                            ${qr.status === 1 ? '● 活跃' : '○ 已停用'}
                        </span>
                    </div>
                    <div class="qr-info">
                        <div class="qr-info-item">
                            <label>微信号:</label>
                            <span>${qr.wechat_id || '-'}</span>
                        </div>
                        <div class="qr-info-item">
                            <label>访问次数:</label>
                            <span>${qr.visit_count}</span>
                        </div>
                        <div class="qr-info-item">
                            <label>今日访问:</label>
                            <span>${qr.daily_count}</span>
                        </div>
                    </div>
                    <div class="qr-actions">
                        <button class="btn ${qr.status === 1 ? 'btn-danger' : 'btn-success'}" 
                                onclick="toggleQRStatus(${index})">
                            ${qr.status === 1 ? '停用' : '启用'}
                        </button>
                        <button class="btn btn-secondary" onclick="deleteQRCode(${index})">
                            删除
                        </button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            updateStats();
        }

        // 更新统计信息
        function updateStats() {
            const totalVisits = config.settings.total_visits || 0;
            const activeCount = config.wechat_qrcodes.filter(qr => qr.status === 1).length;
            const totalCount = config.wechat_qrcodes.length;

            document.getElementById('total-visits').textContent = totalVisits;
            document.getElementById('active-count').textContent = activeCount;
            document.getElementById('total-count').textContent = totalCount;
        }

        // 切换二维码状态
        async function toggleQRStatus(index) {
            config.wechat_qrcodes[index].status = config.wechat_qrcodes[index].status === 1 ? 0 : 1;
            await updateConfig();
            renderQRList();
        }

        // 删除二维码
        async function deleteQRCode(index) {
            if (!confirm('确定要删除这个二维码吗？')) return;
            
            config.wechat_qrcodes.splice(index, 1);
            await updateConfig();
            renderQRList();
        }

        // 切换添加表单
        function toggleAddForm() {
            const form = document.getElementById('add-form');
            form.classList.toggle('show');
        }

        // 添加二维码
        async function addQRCode() {
            const name = document.getElementById('new-name').value.trim();
            const wechatId = document.getElementById('new-wechat').value.trim();

            if (!name) {
                alert('请填写名称');
                return;
            }

            if (!selectedImageFile) {
                alert('请选择二维码图片');
                return;
            }

            // 上传图片
            const timestamp = Date.now();
            const ext = selectedImageFile.name.split('.').pop();
            const filename = `qrcode_${timestamp}.${ext}`;
            
            try {
                document.querySelector('.btn-success').textContent = '上传中...';
                document.querySelector('.btn-success').disabled = true;
                
                const imageUrl = await uploadImageToGitHub(filename, selectedImageFile);
                
                const newQR = {
                    id: config.wechat_qrcodes.length + 1,
                    name: name,
                    qrcode_url: imageUrl,
                    wechat_id: wechatId,
                    status: 1,
                    visit_count: 0,
                    daily_limit: 0,
                    daily_count: 0
                };

                config.wechat_qrcodes.push(newQR);
                await updateConfig();
                renderQRList();
                toggleAddForm();

                // 清空表单
                document.getElementById('new-name').value = '';
                document.getElementById('new-wechat').value = '';
                document.getElementById('new-file').value = '';
                document.getElementById('image-preview').style.display = 'none';
                selectedImageFile = null;
                
                document.querySelector('.btn-success').textContent = '添加';
                document.querySelector('.btn-success').disabled = false;
                
                alert('添加成功！');
            } catch (error) {
                alert('添加失败：' + error.message);
                document.querySelector('.btn-success').textContent = '添加';
                document.querySelector('.btn-success').disabled = false;
            }
        }

        // 更新设置
        async function updateSettings() {
            const mode = document.getElementById('switch-mode').value;
            config.settings.switch_mode = mode;
            await updateConfig();
        }

        // 初始化
        async function init() {
            const loaded = await fetchConfig();
            if (!loaded) {
                alert('加载配置失败');
                return;
            }

            // 加载设置
            document.getElementById('switch-mode').value = config.settings.switch_mode || 'round';
            
            renderQRList();
        }

        init();
    </script>
</body>
</html>
